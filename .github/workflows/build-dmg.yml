name: Build macOS DMG

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js
        run: npm run build

      - name: Build DMG
        env:
          # Code signing and notarization secrets (optional for testing, required for production)
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # If no certificate is provided, set CSC_IDENTITY_AUTO_DISCOVERY to false to bypass local keychain identity lookups
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MACOS_CERTIFICATE_P12 && 'true' || 'false' }}
        run: npx electron-builder --mac dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Chatdemo-macOS
          path: dist/*.dmg