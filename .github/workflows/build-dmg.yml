name: Build macOS DMG

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Build DMG
        run: npx electron-builder --mac dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Chatdemo-macOS
          path: dist/*.dmg